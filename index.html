<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SONDRIFT — Sound & Sensation Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=DM+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #080808;
    --off-black: #111111;
    --dark: #1c1c1c;
    --charcoal: #2e2e2e;
    --mid: #525252;
    --light-mid: #808080;
    --silver: #adadad;
    --off-white: #e6e6e6;
    --white: #f4f4f4;
    --accent: #c8c8c8;
    --accent-dim: #909090;
    --accent-pale: #181818;
    --gold: #d4a853;
    --gold-dim: #a07828;
    --gold-pale: #1e1608;
    --serif: 'Playfair Display', Georgia, serif;
    --sans: 'DM Sans', sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--off-white);
    font-family: var(--sans);
    font-weight: 300;
    overflow-x: hidden;
    cursor: none;
  }

  /* Custom cursor */
  .cursor {
    position: fixed;
    width: 8px; height: 8px;
    background: var(--white);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.1s ease, width 0.2s ease, height 0.2s ease, background 0.2s ease;
  }
  .cursor-ring {
    position: fixed;
    width: 36px; height: 36px;
    border: 1px solid rgba(200,200,200,0.4);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    transition: all 0.15s ease;
  }
  body:hover .cursor { opacity: 1; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: var(--black); }
  ::-webkit-scrollbar-thumb { background: var(--charcoal); }

  /* Nav */
  nav {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 2rem 4rem;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(to bottom, rgba(10,10,10,0.95) 0%, transparent 100%);
    transition: all 0.4s ease;
  }
  nav.scrolled {
    padding: 1.2rem 4rem;
    background: rgba(10,10,10,0.97);
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .logo {
    font-family: var(--serif);
    font-size: 1.4rem;
    font-weight: 400;
    letter-spacing: 0.15em;
    color: var(--white);
    text-decoration: none;
    display: inline-flex;
    align-items: baseline;
    gap: 0;
  }
  .logo .son {
    color: var(--silver);
    font-style: italic;
    font-weight: 400;
  }
  .logo .drift {
    color: var(--white);
    font-style: normal;
    font-weight: 500;
    letter-spacing: 0.08em;
  }
  .logo .logo-mark {
    width: 5px; height: 5px;
    background: var(--gold);
    border-radius: 50%;
    display: inline-block;
    margin: 0 2px 5px 2px;
    flex-shrink: 0;
  }
  .nav-links {
    display: flex; gap: 3rem; list-style: none;
  }
  .nav-links a {
    font-family: var(--sans);
    font-size: 0.7rem;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--silver);
    text-decoration: none;
    transition: color 0.3s;
  }
  .nav-links a:hover { color: var(--accent); }
  .nav-cta {
    font-size: 0.65rem;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--black);
    background: var(--white);
    padding: 0.7rem 1.8rem;
    border: none;
    cursor: none;
    transition: background 0.3s, color 0.3s;
    text-decoration: none;
  }
  .nav-cta:hover { background: var(--silver); color: var(--black); }

  /* Hero */
  .hero {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* === BACKGROUND IMAGE LAYER === */
  .hero-bg-img {
    position: absolute; inset: 0; z-index: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transition: opacity 0.8s ease;
    opacity: 0;
  }
  .hero-bg-img.loaded { opacity: 1; }

  /* Dark overlay — sits above image, below content. Keeps text legible. */
  .hero-overlay {
    position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(
      to bottom,
      rgba(10,10,10,0.55) 0%,
      rgba(10,10,10,0.40) 40%,
      rgba(10,10,10,0.65) 100%
    );
    transition: background 0.4s ease;
  }
  /* Vignette ring — softens edges regardless of image */
  .hero-overlay::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(10,10,10,0.7) 100%);
  }

  .hero-bg {
    position: absolute; inset: 0; z-index: 0;
    background: radial-gradient(ellipse at 30% 55%, rgba(255,255,255,0.03) 0%, transparent 55%),
                radial-gradient(ellipse at 70% 20%, rgba(255,255,255,0.02) 0%, transparent 45%),
                var(--black);
    transition: opacity 0.8s ease;
  }
  .hero-bg.hidden { opacity: 0; pointer-events: none; }

  .hero-lines {
    position: absolute; inset: 0; z-index: 1;
    background-image: 
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 80px 80px;
    transition: opacity 0.8s ease;
  }
  .hero-lines.hidden { opacity: 0; }

  /* === IMAGE UPLOAD PANEL === */
  .bg-upload-panel {
    position: absolute; bottom: 5.5rem; right: 2.5rem; z-index: 10;
    display: flex; flex-direction: column; align-items: flex-end; gap: 0.6rem;
  }
  .bg-upload-btn {
    display: flex; align-items: center; gap: 0.6rem;
    background: rgba(10,10,10,0.75);
    border: 1px solid rgba(200,200,200,0.3);
    color: var(--accent);
    padding: 0.55rem 1rem;
    font-family: var(--sans); font-size: 0.58rem;
    font-weight: 400; letter-spacing: 0.2em; text-transform: uppercase;
    cursor: none; transition: all 0.3s;
    backdrop-filter: blur(8px);
  }
  .bg-upload-btn:hover {
    background: rgba(200,200,200,0.12);
    border-color: var(--accent);
  }
  .bg-upload-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

  /* Overlay strength slider */
  .overlay-controls {
    display: none;
    background: rgba(10,10,10,0.82);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 1rem 1.2rem;
    backdrop-filter: blur(12px);
    min-width: 200px;
  }
  .overlay-controls.visible { display: block; }
  .overlay-controls label {
    display: block; font-size: 0.55rem; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--mid); margin-bottom: 0.5rem;
  }
  .overlay-controls input[type=range] {
    width: 100%; accent-color: var(--accent);
    background: none; cursor: none;
  }
  .overlay-val {
    font-size: 0.65rem; color: var(--accent);
    text-align: right; margin-top: 0.3rem; font-family: var(--serif);
    font-style: italic;
  }
  .overlay-divider { height: 1px; background: rgba(255,255,255,0.06); margin: 0.8rem 0; }
  .btn-remove-bg {
    width: 100%; background: none;
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--mid); font-family: var(--sans);
    font-size: 0.55rem; letter-spacing: 0.2em; text-transform: uppercase;
    padding: 0.4rem; cursor: none; transition: all 0.3s;
  }
  .btn-remove-bg:hover { border-color: rgba(255,80,80,0.4); color: #ff6b6b; }

  /* Tooltip hint */
  .bg-hint {
    font-size: 0.55rem; color: var(--mid); letter-spacing: 0.1em;
    text-align: right; opacity: 0.7;
  }
  .hero-content {
    position: relative; z-index: 2;
    text-align: center;
    max-width: 900px;
    padding: 0 2rem;
    animation: fadeUp 1.2s ease forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .hero-eyebrow {
    font-size: 0.65rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--silver);
    margin-bottom: 2.5rem;
    display: flex; align-items: center; justify-content: center; gap: 1.5rem;
  }
  .hero-eyebrow::before, .hero-eyebrow::after {
    content: '';
    width: 40px; height: 1px;
    background: var(--silver);
    opacity: 0.4;
  }
  .hero-title {
    font-family: var(--serif);
    font-size: clamp(3.5rem, 9vw, 8rem);
    font-weight: 300;
    line-height: 0.95;
    letter-spacing: -0.01em;
    color: var(--white);
    margin-bottom: 1rem;
  }
  .hero-title em {
    font-style: italic;
    color: var(--accent);
  }
  .hero-subtitle {
    font-family: var(--serif);
    font-size: clamp(1.1rem, 2vw, 1.6rem);
    font-weight: 300;
    font-style: italic;
    color: var(--silver);
    margin-bottom: 3.5rem;
    letter-spacing: 0.02em;
  }
  .hero-actions {
    display: flex; gap: 1.5rem; justify-content: center; align-items: center; flex-wrap: wrap;
  }
  .btn-primary {
    background: var(--white);
    color: var(--black);
    padding: 1rem 2.5rem;
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    text-decoration: none;
    border: none;
    cursor: none;
    transition: all 0.3s;
    display: inline-block;
  }
  .btn-primary:hover { background: var(--silver); color: var(--black); transform: translateY(-2px); }
  .btn-ghost {
    background: transparent;
    color: var(--silver);
    padding: 1rem 2.5rem;
    font-size: 0.65rem;
    font-weight: 400;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    text-decoration: none;
    border: 1px solid rgba(255,255,255,0.2);
    cursor: none;
    transition: all 0.3s;
    display: inline-block;
  }
  .btn-ghost:hover { border-color: var(--white); color: var(--white); transform: translateY(-2px); }

  .hero-scroll {
    position: absolute; bottom: 3rem; left: 50%;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 0.8rem;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:0.9} }
  .hero-scroll span {
    font-size: 0.55rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--mid);
  }
  .scroll-line {
    width: 1px; height: 40px;
    background: linear-gradient(to bottom, var(--accent), transparent);
  }

  /* Sections */
  section { padding: 8rem 4rem; }
  .section-inner { max-width: 1200px; margin: 0 auto; }

  .section-label {
    font-size: 0.6rem; letter-spacing: 0.35em; text-transform: uppercase;
    color: var(--silver); margin-bottom: 1.5rem;
    display: flex; align-items: center; gap: 1rem;
  }
  .section-label::after {
    content: ''; flex: 1; max-width: 60px; height: 1px;
    background: var(--silver); opacity: 0.3;
  }
  .section-title {
    font-family: var(--serif);
    font-size: clamp(2.2rem, 4vw, 3.5rem);
    font-weight: 300;
    line-height: 1.1;
    color: var(--white);
    margin-bottom: 1.5rem;
  }
  .section-title em { font-style: italic; color: var(--accent); }
  .section-body {
    font-size: 0.9rem;
    line-height: 1.9;
    color: var(--light-mid);
    max-width: 560px;
  }

  /* About */
  .about { background: var(--off-black); }
  .about-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8rem; align-items: center;
  }
  .about-visual {
    position: relative; aspect-ratio: 3/4;
  }
  .about-box {
    position: absolute; inset: 0;
    border: 1px solid rgba(200,200,200,0.15);
  }
  .about-box::before {
    content: '';
    position: absolute; top: 20px; left: 20px; right: -20px; bottom: -20px;
    border: 1px solid rgba(200,200,200,0.06);
  }
  .about-inner {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center; gap: 2rem;
    background: linear-gradient(135deg, rgba(200,200,200,0.07) 0%, rgba(224,168,74,0.03) 100%);
  }
  .wave-viz {
    display: flex; align-items: center; gap: 3px; height: 60px;
  }
  .wave-bar {
    width: 3px; background: var(--white);
    border-radius: 2px; opacity: 0.7;
    animation: wave-anim 1.4s ease-in-out infinite;
  }
  .wave-bar:nth-child(2) { animation-delay: 0.1s; }
  .wave-bar:nth-child(3) { animation-delay: 0.2s; }
  .wave-bar:nth-child(4) { animation-delay: 0.3s; }
  .wave-bar:nth-child(5) { animation-delay: 0.2s; }
  .wave-bar:nth-child(6) { animation-delay: 0.1s; }
  .wave-bar:nth-child(7) { animation-delay: 0.0s; }
  .wave-bar:nth-child(8) { animation-delay: 0.15s; }
  .wave-bar:nth-child(9) { animation-delay: 0.25s; }
  .wave-bar:nth-child(10) { animation-delay: 0.35s; }
  @keyframes wave-anim {
    0%,100% { height: 8px; opacity: 0.3; }
    50% { height: 50px; opacity: 0.8; }
  }
  .about-stat {
    font-family: var(--serif);
    font-size: 0.85rem; letter-spacing: 0.1em;
    color: var(--silver); text-align: center;
  }
  .about-stat strong {
    display: block; font-size: 2.5rem; font-weight: 300;
    color: var(--accent); font-style: italic; line-height: 1;
    margin-bottom: 0.3rem;
  }

  /* Shop */
  .shop { background: var(--black); }
  .tabs {
    display: flex; gap: 0; margin-bottom: 4rem;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .tab {
    padding: 1rem 2rem;
    font-size: 0.65rem; font-weight: 400;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--mid); background: none; border: none;
    cursor: none; transition: color 0.3s;
    position: relative;
  }
  .tab::after {
    content: ''; position: absolute; bottom: -1px; left: 0; right: 0;
    height: 1px; background: var(--white);
    transform: scaleX(0); transition: transform 0.3s;
  }
  .tab.active { color: var(--accent); }
  .tab.active::after { transform: scaleX(1); }
  .tab:hover { color: var(--silver); }

  .tab-content { display: none; }
  .tab-content.active { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }

  .product-card {
    background: var(--off-black);
    overflow: hidden;
    transition: transform 0.4s ease;
    position: relative;
  }
  .product-card:hover { transform: translateY(-4px); }
  .product-thumb {
    aspect-ratio: 1;
    background: var(--dark);
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .product-thumb::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(200,200,200,0.08) 0%, transparent 60%);
    transition: opacity 0.4s;
  }
  .product-card:hover .product-thumb::before { opacity: 0; }
  .product-icon {
    width: 48px; height: 48px;
    opacity: 0.25; transition: opacity 0.4s, transform 0.4s;
  }
  .product-card:hover .product-icon { opacity: 0.5; transform: scale(1.1); }
  .product-body { padding: 1.5rem; }
  .product-type {
    font-size: 0.55rem; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 0.5rem;
  }
  .product-name {
    font-family: var(--serif); font-size: 1.2rem; font-weight: 400;
    color: var(--white); margin-bottom: 0.4rem; line-height: 1.2;
  }
  .product-desc {
    font-size: 0.78rem; color: var(--light-mid); line-height: 1.7;
    margin-bottom: 1.2rem;
  }
  .product-footer {
    display: flex; align-items: center; justify-content: space-between;
  }
  .product-price {
    font-family: var(--serif); font-size: 1.4rem; font-weight: 300;
    color: var(--white);
  }
  .product-price span { font-size: 0.8rem; color: var(--mid); }
  .btn-add {
    background: none; border: 1px solid rgba(255,255,255,0.2);
    color: var(--silver); padding: 0.5rem 1.2rem;
    font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase;
    cursor: none; transition: all 0.3s;
  }
  .btn-add:hover { background: var(--white); color: var(--black); border-color: var(--white); }
  .badge-new {
    position: absolute; top: 1rem; right: 1rem;
    background: rgba(255,255,255,0.12); color: var(--white);
    border: 1px solid rgba(255,255,255,0.2);
    font-size: 0.55rem; letter-spacing: 0.2em; text-transform: uppercase;
    padding: 0.3rem 0.7rem;
  }

  /* Pricing */
  .pricing { background: var(--off-black); }
  .pricing-intro {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6rem; margin-bottom: 5rem; align-items: end;
  }
  .pricing-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px;
  }
  .plan-card {
    background: var(--dark);
    padding: 3rem 2.5rem;
    position: relative; overflow: hidden;
    transition: transform 0.4s;
  }
  .plan-card:hover { transform: translateY(-6px); }
  .plan-card.featured {
    background: var(--charcoal);
    border-top: 2px solid var(--white);
  }
  .plan-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 100%;
    background: linear-gradient(180deg, rgba(200,200,200,0.04) 0%, transparent 50%);
  }
  .plan-badge {
    font-size: 0.55rem; letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--black); background: var(--white);
    padding: 0.3rem 0.8rem; display: inline-block;
    margin-bottom: 2rem;
  }
  .plan-name {
    font-family: var(--serif); font-size: 2rem; font-weight: 300;
    color: var(--white); margin-bottom: 0.5rem;
  }
  .plan-tagline {
    font-size: 0.78rem; color: var(--light-mid);
    margin-bottom: 2rem; line-height: 1.6;
  }
  .plan-price {
    font-family: var(--serif); font-size: 3.5rem; font-weight: 300;
    color: var(--white); line-height: 1; margin-bottom: 0.5rem;
  }
  .plan-price sup {
    font-size: 1.2rem; vertical-align: super; color: var(--silver);
  }
  .plan-period {
    font-size: 0.7rem; color: var(--mid); letter-spacing: 0.1em;
    margin-bottom: 2.5rem;
  }
  .plan-divider {
    height: 1px; background: rgba(255,255,255,0.06); margin-bottom: 2rem;
  }
  .plan-features { list-style: none; margin-bottom: 2.5rem; }
  .plan-features li {
    font-size: 0.8rem; color: var(--silver);
    padding: 0.6rem 0; border-bottom: 1px solid rgba(255,255,255,0.04);
    display: flex; align-items: center; gap: 0.8rem; line-height: 1.4;
  }
  .plan-features li::before {
    content: ''; width: 5px; height: 5px;
    background: var(--white); border-radius: 50%; flex-shrink: 0;
  }
  .plan-features li.dim { color: var(--charcoal); }
  .plan-features li.dim::before { background: var(--charcoal); }
  .btn-plan {
    width: 100%; padding: 1rem;
    font-size: 0.65rem; font-weight: 400;
    letter-spacing: 0.2em; text-transform: uppercase;
    cursor: none; transition: all 0.3s; border: none;
  }
  .btn-plan-ghost {
    background: none; color: var(--silver);
    border: 1px solid rgba(255,255,255,0.12);
  }
  .btn-plan-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-plan-solid {
    background: var(--charcoal); color: var(--silver);
  }
  .btn-plan-solid:hover { background: var(--silver); color: var(--white); }

  /* Custom */
  .custom { background: var(--black); }
  .custom-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6rem; align-items: center;
  }
  .custom-steps { margin-top: 3rem; }
  .custom-step {
    display: flex; gap: 1.5rem; padding: 1.8rem 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .step-num {
    font-family: var(--serif); font-size: 0.8rem; font-style: italic;
    color: var(--accent); opacity: 0.6; min-width: 24px; padding-top: 2px;
  }
  .step-content h4 {
    font-family: var(--serif); font-size: 1.1rem; font-weight: 400;
    color: var(--white); margin-bottom: 0.4rem;
  }
  .step-content p {
    font-size: 0.8rem; color: var(--light-mid); line-height: 1.7;
  }
  .custom-form-preview {
    background: var(--off-black);
    border: 1px solid rgba(255,255,255,0.06);
    padding: 3rem;
  }
  .form-title {
    font-family: var(--serif); font-size: 1.5rem; font-weight: 300;
    color: var(--white); margin-bottom: 0.5rem;
  }
  .form-sub {
    font-size: 0.75rem; color: var(--light-mid); margin-bottom: 2.5rem;
  }
  .form-group { margin-bottom: 1.5rem; }
  .form-label {
    display: block; font-size: 0.6rem; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--mid); margin-bottom: 0.6rem;
  }
  .form-input, .form-select, .form-textarea {
    width: 100%; background: var(--dark);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--off-white); padding: 0.8rem 1rem;
    font-family: var(--sans); font-size: 0.85rem; font-weight: 300;
    outline: none; transition: border-color 0.3s;
    appearance: none;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color: var(--accent);
  }
  .form-textarea { resize: none; height: 100px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

  /* Testimonials */
  .testimonials { background: var(--off-black); padding: 6rem 4rem; }
  .testimonials-inner { max-width: 900px; margin: 0 auto; text-align: center; }
  .testimonials h2 {
    font-family: var(--serif); font-size: clamp(1.8rem, 3vw, 2.5rem);
    font-weight: 300; color: var(--white); margin-bottom: 4rem;
  }
  .testimonials h2 em { font-style: italic; color: var(--accent); }
  .testimonials-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px;
    margin-bottom: 3rem;
  }
  .testimonial {
    background: var(--dark); padding: 2.5rem;
    text-align: left;
  }
  .testimonial-text {
    font-family: var(--serif); font-size: 1rem; font-style: italic;
    color: var(--silver); line-height: 1.8; margin-bottom: 1.5rem;
  }
  .testimonial-author {
    font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--accent);
  }
  .testimonial-stars {
    color: var(--gold); font-size: 0.7rem; margin-bottom: 1rem;
    letter-spacing: 0.1em;
  }

  /* Footer */
  footer {
    background: var(--off-black);
    border-top: 1px solid rgba(255,255,255,0.05);
    padding: 5rem 4rem 3rem;
  }
  .footer-grid {
    max-width: 1200px; margin: 0 auto;
    display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 4rem;
    margin-bottom: 4rem;
  }
  .footer-brand .logo { display: block; margin-bottom: 1.2rem; }
  .footer-brand p {
    font-size: 0.8rem; color: var(--mid); line-height: 1.8; max-width: 280px;
  }
  .footer-col h5 {
    font-size: 0.6rem; letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 1.5rem;
  }
  .footer-col ul { list-style: none; }
  .footer-col ul li { margin-bottom: 0.8rem; }
  .footer-col ul li a {
    font-size: 0.8rem; color: var(--mid); text-decoration: none;
    transition: color 0.3s;
  }
  .footer-col ul li a:hover { color: var(--silver); }
  .footer-bottom {
    max-width: 1200px; margin: 0 auto;
    border-top: 1px solid rgba(255,255,255,0.05);
    padding-top: 2rem;
    display: flex; justify-content: space-between; align-items: center;
  }
  .footer-bottom p { font-size: 0.7rem; color: var(--mid); }

  /* Ambient */
  .ambient-bar {
    background: var(--accent-pale);
    border-top: 1px solid rgba(200,200,200,0.15);
    border-bottom: 1px solid rgba(200,200,200,0.15);
    padding: 1.2rem 4rem;
    display: flex; align-items: center; justify-content: center; gap: 3rem;
    overflow: hidden;
  }
  .ambient-item {
    font-size: 0.6rem; letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--accent); white-space: nowrap; opacity: 0.8;
  }
  .ambient-dot {
    width: 3px; height: 3px; background: var(--gold);
    border-radius: 50%; opacity: 0.5; flex-shrink: 0;
  }

  /* Animations */
  .fade-in {
    opacity: 0; transform: translateY(20px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .fade-in.visible { opacity: 1; transform: translateY(0); }

  /* ============================================
     PRICING MODALS
  ============================================ */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 500;
    background: rgba(5,5,5,0.88);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s ease;
    padding: 2rem;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--off-black);
    border: 1px solid rgba(255,255,255,0.07);
    max-width: 860px; width: 100%;
    max-height: 88vh; overflow-y: auto;
    position: relative;
    transform: translateY(20px);
    transition: transform 0.4s ease;
    scrollbar-width: thin; scrollbar-color: var(--charcoal) transparent;
  }
  .modal-backdrop.open .modal { transform: translateY(0); }

  .modal-header {
    padding: 2.5rem 3rem 1.5rem;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem;
    position: sticky; top: 0; background: var(--off-black); z-index: 2;
  }
  .modal-header-left .modal-eyebrow {
    font-size: 0.58rem; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 0.5rem;
  }
  .modal-title {
    font-family: var(--serif); font-size: 2rem; font-weight: 300;
    color: var(--white); line-height: 1.1;
  }
  .modal-title em { font-style: italic; color: var(--accent); }
  .modal-header-right { display: flex; align-items: center; gap: 0.8rem; flex-shrink: 0; }

  .btn-modal-close {
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    color: var(--silver); cursor: none;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s; flex-shrink: 0;
  }
  .btn-modal-close:hover { background: rgba(255,80,80,0.15); border-color: rgba(255,80,80,0.3); color: #ff6b6b; }
  .btn-modal-close svg { width: 12px; height: 12px; stroke: currentColor; }

  .btn-edit-toggle {
    display: flex; align-items: center; gap: 0.5rem;
    background: rgba(200,200,200,0.08); border: 1px solid rgba(200,200,200,0.25);
    color: var(--accent); padding: 0.45rem 1rem;
    font-family: var(--sans); font-size: 0.58rem;
    font-weight: 400; letter-spacing: 0.18em; text-transform: uppercase;
    cursor: none; transition: all 0.25s;
  }
  .btn-edit-toggle:hover { background: rgba(200,200,200,0.16); }
  .btn-edit-toggle.editing { background: rgba(200,200,200,0.2); border-color: var(--accent); }
  .btn-edit-toggle svg { width: 11px; height: 11px; stroke: currentColor; flex-shrink: 0; }

  .modal-body { padding: 2.5rem 3rem; }

  /* ── Shop pricing grid ── */
  .shop-price-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin-bottom: 2rem;
  }
  .shop-price-card {
    background: var(--dark); padding: 1.8rem 1.5rem;
    transition: background 0.3s;
  }
  .spc-category {
    font-size: 0.55rem; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 1.2rem;
    padding-bottom: 0.8rem; border-bottom: 1px solid rgba(200,200,200,0.15);
  }
  .spc-item {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 0.65rem 0; border-bottom: 1px solid rgba(255,255,255,0.04);
    gap: 0.5rem;
  }
  .spc-item:last-child { border-bottom: none; }
  .spc-name {
    font-size: 0.8rem; color: var(--silver); line-height: 1.3; flex: 1;
  }
  .spc-price {
    font-family: var(--serif); font-size: 1.1rem; font-weight: 300;
    color: var(--white); white-space: nowrap; flex-shrink: 0;
  }
  .spc-sub {
    font-size: 0.65rem; color: var(--mid); margin-top: 0.2rem;
  }

  /* Editable price input */
  .price-input {
    font-family: var(--serif); font-size: 1.1rem; font-weight: 300;
    color: var(--accent); background: rgba(200,200,200,0.06);
    border: 1px solid rgba(200,200,200,0.3);
    padding: 0.15rem 0.4rem; width: 72px;
    text-align: right; outline: none;
    display: none;
    transition: border-color 0.2s;
  }
  .price-input:focus { border-color: var(--accent); background: rgba(200,200,200,0.1); }
  .editing-mode .price-input { display: inline-block; }
  .editing-mode .spc-price { display: none; }
  .editing-mode .plan-price-display { display: none; }
  .editing-mode .plan-price-input { display: flex !important; }

  /* ── Subscription plan cards in modal ── */
  .modal-plans { display: grid; grid-template-columns: repeat(3,1fr); gap: 2px; }
  .modal-plan {
    background: var(--dark); padding: 2rem 1.8rem;
    position: relative; transition: background 0.3s;
  }
  .modal-plan.featured { background: var(--charcoal); border-top: 2px solid var(--white); }
  .modal-plan-badge {
    font-size: 0.5rem; letter-spacing: 0.22em; text-transform: uppercase;
    background: var(--charcoal); color: var(--silver);
    padding: 0.2rem 0.6rem; display: inline-block; margin-bottom: 1.2rem;
  }
  .modal-plan-name {
    font-family: var(--serif); font-size: 1.5rem; font-weight: 300;
    color: var(--white); margin-bottom: 0.3rem;
  }
  .modal-plan-tagline {
    font-size: 0.72rem; color: var(--light-mid); line-height: 1.5;
    margin-bottom: 1.2rem;
  }
  .plan-price-display {
    display: flex; align-items: baseline; gap: 0.2rem; margin-bottom: 0.3rem;
  }
  .plan-price-display .currency {
    font-size: 0.8rem; color: var(--silver); font-family: var(--sans);
  }
  .plan-price-display .amount {
    font-family: var(--serif); font-size: 2.4rem; font-weight: 300; color: var(--white);
    line-height: 1;
  }
  .plan-price-display .cents {
    font-size: 1rem; color: var(--silver);
  }
  .plan-price-input {
    display: none; align-items: center; gap: 0.4rem; margin-bottom: 0.3rem;
  }
  .plan-price-input .currency-label {
    font-size: 0.7rem; color: var(--mid);
  }
  .plan-price-edit {
    font-family: var(--serif); font-size: 1.6rem; font-weight: 300;
    color: var(--accent); background: rgba(200,200,200,0.06);
    border: 1px solid rgba(200,200,200,0.3);
    padding: 0.2rem 0.5rem; width: 100px;
    outline: none; transition: border-color 0.2s;
  }
  .plan-price-edit:focus { border-color: var(--accent); background: rgba(200,200,200,0.1); }
  .plan-period-label {
    font-size: 0.65rem; color: var(--mid); letter-spacing: 0.1em;
    margin-bottom: 1.2rem;
  }
  .modal-plan-divider { height: 1px; background: rgba(255,255,255,0.06); margin-bottom: 1.2rem; }
  .modal-plan-features { list-style: none; }
  .modal-plan-features li {
    font-size: 0.75rem; color: var(--silver); padding: 0.45rem 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    display: flex; align-items: flex-start; gap: 0.6rem; line-height: 1.4;
  }
  .modal-plan-features li:last-child { border-bottom: none; }
  .modal-plan-features li::before {
    content: ''; width: 4px; height: 4px; background: var(--white);
    border-radius: 50%; flex-shrink: 0; margin-top: 0.4rem;
  }
  .modal-plan-features li.dim { color: var(--charcoal); }
  .modal-plan-features li.dim::before { background: var(--charcoal); }

  .modal-plan-cta {
    margin-top: 1.5rem; width: 100%; padding: 0.85rem;
    font-family: var(--sans); font-size: 0.62rem; font-weight: 400;
    letter-spacing: 0.18em; text-transform: uppercase; cursor: none;
    transition: all 0.3s; border: none;
  }
  .cta-ghost { background: none; color: var(--silver); border: 1px solid rgba(255,255,255,0.1); }
  .cta-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .cta-solid { background: var(--white); color: var(--black); }
  .cta-solid:hover { background: var(--silver); color: var(--black); }

  /* Edit-mode name input */
  .plan-name-input {
    font-family: var(--serif); font-size: 1.5rem; font-weight: 300;
    color: var(--accent); background: rgba(200,200,200,0.06);
    border: 1px solid rgba(200,200,200,0.3);
    padding: 0.2rem 0.5rem; width: 100%;
    outline: none; margin-bottom: 0.5rem;
    display: none;
  }
  .editing-mode .plan-name-input { display: block; }
  .editing-mode .modal-plan-name { display: none; }

  .edit-save-bar {
    display: none; align-items: center; justify-content: space-between;
    padding: 1rem 3rem; background: rgba(200,200,200,0.06);
    border-top: 1px solid rgba(200,200,200,0.15);
    position: sticky; bottom: 0;
  }
  .edit-save-bar.visible { display: flex; }
  .edit-save-bar p { font-size: 0.72rem; color: var(--light-mid); font-style: italic; }
  .btn-save-prices {
    background: var(--white); color: var(--black);
    border: none; padding: 0.65rem 2rem;
    font-family: var(--sans); font-size: 0.6rem;
    font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase;
    cursor: none; transition: all 0.25s;
  }
  .btn-save-prices:hover { background: var(--silver); color: var(--black); }

  /* Modal note */
  .modal-note {
    font-size: 0.72rem; color: var(--mid); line-height: 1.8;
    padding: 1.2rem 1.5rem; background: rgba(255,255,255,0.02);
    border-left: 2px solid rgba(200,200,200,0.2);
    margin-top: 1.5rem; font-style: italic;
  }

  /* Upload zone inside product thumb */
  .media-upload-zone {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 0.5rem; z-index: 3;
    opacity: 0; transition: opacity 0.3s;
    background: rgba(10,10,10,0.6);
    backdrop-filter: blur(4px);
  }
  .product-card:hover .media-upload-zone { opacity: 1; }
  .media-upload-zone.has-media { opacity: 0 !important; }
  .media-upload-zone.has-media:hover { opacity: 1 !important; }

  .upload-zone-btn {
    background: rgba(200,200,200,0.15);
    border: 1px solid rgba(200,200,200,0.4);
    color: var(--accent);
    padding: 0.5rem 1.1rem;
    font-family: var(--sans); font-size: 0.6rem;
    font-weight: 400; letter-spacing: 0.2em; text-transform: uppercase;
    cursor: none; transition: all 0.25s;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .upload-zone-btn:hover { background: rgba(200,200,200,0.3); }
  .upload-zone-btn svg { width: 12px; height: 12px; flex-shrink: 0; }
  .upload-zone-label {
    font-size: 0.55rem; color: var(--light-mid);
    letter-spacing: 0.15em; text-transform: uppercase;
  }

  /* ── AUDIO PLAYER ── */
  .audio-player {
    display: none;
    position: absolute; inset: 0; z-index: 4;
    flex-direction: column;
    justify-content: flex-end;
    padding: 1.2rem;
    background: linear-gradient(to top, rgba(10,10,10,0.92) 0%, rgba(10,10,10,0.2) 60%, transparent 100%);
  }
  .audio-player.active { display: flex; }

  .audio-waveform {
    display: flex; align-items: center; gap: 2px;
    height: 36px; margin-bottom: 0.8rem; overflow: hidden;
  }
  .audio-bar {
    flex: 1; background: var(--white);
    border-radius: 1px; opacity: 0.35;
    transition: opacity 0.1s, height 0.05s;
    min-height: 3px;
  }
  .audio-bar.active { opacity: 0.9; }

  .audio-controls {
    display: flex; align-items: center; gap: 0.8rem;
  }
  .audio-play-btn {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--white); border: none; cursor: none;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: background 0.2s, transform 0.2s;
  }
  .audio-play-btn:hover { background: var(--silver); transform: scale(1.08); }
  .audio-play-btn svg { width: 12px; height: 12px; fill: var(--black); }

  .audio-progress-wrap {
    flex: 1; position: relative; height: 3px;
    background: rgba(255,255,255,0.12); cursor: none;
  }
  .audio-progress-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--white); width: 0%; transition: width 0.1s linear;
    pointer-events: none;
  }
  .audio-progress-thumb {
    position: absolute; top: 50%; width: 10px; height: 10px;
    background: var(--white); border-radius: 50%;
    transform: translate(-50%, -50%);
    left: 0%; transition: left 0.1s linear;
    pointer-events: none;
  }

  .audio-time {
    font-size: 0.6rem; color: var(--silver);
    font-variant-numeric: tabular-nums; min-width: 64px;
    text-align: right; font-family: var(--sans);
  }
  .audio-remove {
    width: 20px; height: 20px; border-radius: 50%;
    background: rgba(255,255,255,0.08); border: none; cursor: none;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .audio-remove:hover { background: rgba(255,80,80,0.25); }
  .audio-remove svg { width: 8px; height: 8px; stroke: var(--silver); }
  .audio-filename {
    font-size: 0.6rem; color: var(--silver);
    letter-spacing: 0.1em; margin-bottom: 0.5rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 100%;
  }

  /* ── VIDEO PLAYER ── */
  .video-player {
    display: none;
    position: absolute; inset: 0; z-index: 4;
    background: #000;
    flex-direction: column;
  }
  .video-player.active { display: flex; }
  .video-player video {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  .video-controls {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 0.8rem 1rem;
    background: linear-gradient(to top, rgba(10,10,10,0.9) 0%, transparent 100%);
    display: flex; align-items: center; gap: 0.7rem;
    opacity: 0; transition: opacity 0.3s;
  }
  .product-card:hover .video-controls { opacity: 1; }
  .video-play-btn {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--white); border: none; cursor: none;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.2s;
  }
  .video-play-btn:hover { background: var(--silver); transform: scale(1.1); }
  .video-play-btn svg { width: 10px; height: 10px; fill: var(--black); }
  .video-prog-wrap {
    flex: 1; height: 3px; background: rgba(255,255,255,0.15);
    position: relative; cursor: none;
  }
  .video-prog-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--white); width: 0%;
  }
  .video-time {
    font-size: 0.58rem; color: var(--silver);
    font-variant-numeric: tabular-nums; min-width: 60px; text-align: right;
  }
  .video-vol-btn {
    background: none; border: none; cursor: none;
    color: var(--silver); transition: color 0.2s; padding: 0;
    display: flex; align-items: center;
  }
  .video-vol-btn:hover { color: var(--accent); }
  .video-vol-btn svg { width: 13px; height: 13px; stroke: currentColor; }
  .video-remove {
    width: 20px; height: 20px; border-radius: 50%;
    background: rgba(255,255,255,0.08); border: none; cursor: none;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .video-remove:hover { background: rgba(255,80,80,0.25); }
  .video-remove svg { width: 8px; height: 8px; stroke: var(--silver); }

  /* Sample badge */
  .badge-sample {
    position: absolute; top: 1rem; left: 1rem; z-index: 5;
    background: rgba(200,200,200,0.2);
    border: 1px solid rgba(200,200,200,0.4);
    color: var(--accent); font-size: 0.5rem;
    letter-spacing: 0.2em; text-transform: uppercase;
    padding: 0.25rem 0.6rem;
  }

  /* ============================================
     INLINE CONTENT EDITOR
  ============================================ */
  .editable-wrap {
    position: relative;
  }
  /* Pencil trigger — appears on card hover */
  .edit-card-btn {
    position: absolute; top: 0.9rem; right: 0.9rem; z-index: 5;
    width: 26px; height: 26px; border-radius: 50%;
    background: rgba(20,20,20,0.85);
    border: 1px solid rgba(200,200,200,0.25);
    color: var(--accent); cursor: none;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.25s, background 0.2s, border-color 0.2s;
  }
  .product-card:hover .edit-card-btn { opacity: 1; }
  .edit-card-btn:hover { background: rgba(200,200,200,0.15); border-color: var(--accent); }
  .edit-card-btn.active { opacity: 1; background: rgba(200,200,200,0.2); border-color: var(--accent); }
  .edit-card-btn svg { width: 11px; height: 11px; stroke: currentColor; }

  /* Editable name — spans that become inputs */
  .product-name.editable,
  .product-desc.editable {
    position: relative;
  }
  /* Inline text inputs */
  .inline-name-input {
    font-family: var(--serif);
    font-size: 1.2rem; font-weight: 400;
    color: var(--white);
    background: rgba(200,200,200,0.06);
    border: none; border-bottom: 1px solid rgba(200,200,200,0.5);
    outline: none; width: 100%;
    padding: 0.1rem 0.2rem;
    line-height: 1.2; margin-bottom: 0;
    display: none;
    transition: border-color 0.2s;
  }
  .inline-name-input:focus { border-bottom-color: var(--accent); }

  .inline-desc-input {
    font-family: var(--sans);
    font-size: 0.78rem; font-weight: 300;
    color: var(--light-mid);
    background: rgba(200,200,200,0.04);
    border: none; border-bottom: 1px solid rgba(200,200,200,0.3);
    outline: none; width: 100%;
    padding: 0.1rem 0.2rem;
    line-height: 1.7; margin-bottom: 0;
    resize: none; overflow: hidden;
    display: none;
    transition: border-color 0.2s;
    min-height: 60px;
  }
  .inline-desc-input:focus { border-bottom-color: var(--accent); }

  /* When card is in edit mode */
  .product-card.card-editing .product-name { display: none; }
  .product-card.card-editing .inline-name-input { display: block; }
  .product-card.card-editing .product-desc { display: none; }
  .product-card.card-editing .inline-desc-input { display: block; }

  /* Save hint bar */
  .card-edit-hint {
    display: none;
    font-size: 0.58rem; color: var(--accent); letter-spacing: 0.15em;
    text-transform: uppercase; margin-top: 0.5rem;
    opacity: 0.7;
  }
  .product-card.card-editing .card-edit-hint { display: block; }

  /* Saved flash */
  .card-saved-flash {
    position: absolute; bottom: 0.8rem; left: 50%;
    transform: translateX(-50%);
    background: rgba(200,200,200,0.9);
    color: var(--black); font-size: 0.58rem;
    letter-spacing: 0.2em; text-transform: uppercase;
    padding: 0.35rem 1rem; white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
    z-index: 6;
  }
  .card-saved-flash.show { opacity: 1; }

  /* ============================================
     PREFERENCE SURVEY MODAL
  ============================================ */
  .survey-backdrop {
    position: fixed; inset: 0; z-index: 600;
    background: rgba(5,5,5,0.92);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s ease;
    padding: 1.5rem;
  }
  .survey-backdrop.open { opacity: 1; pointer-events: all; }

  .survey-modal {
    background: var(--off-black);
    border: 1px solid rgba(255,255,255,0.07);
    max-width: 680px; width: 100%;
    max-height: 90vh; overflow-y: auto;
    position: relative;
    transform: translateY(24px) scale(0.98);
    transition: transform 0.4s ease;
    scrollbar-width: thin; scrollbar-color: var(--charcoal) transparent;
  }
  .survey-backdrop.open .survey-modal { transform: translateY(0) scale(1); }

  .survey-header {
    padding: 2rem 2.5rem 1.2rem;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    display: flex; align-items: flex-start; justify-content: space-between;
    position: sticky; top: 0; background: var(--off-black); z-index: 2;
  }
  .survey-header-left .survey-eyebrow {
    font-size: 0.58rem; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--silver); margin-bottom: 0.4rem;
    display: flex; align-items: center; gap: 0.8rem;
  }
  .survey-plan-tag {
    background: var(--charcoal); color: var(--silver);
    padding: 0.2rem 0.6rem; font-size: 0.55rem;
    letter-spacing: 0.15em; text-transform: uppercase;
  }
  .survey-title {
    font-family: var(--serif); font-size: 1.6rem; font-weight: 400;
    color: var(--white); line-height: 1.1;
  }
  .survey-title em { font-style: italic; }

  /* Progress bar */
  .survey-progress {
    padding: 0 2.5rem;
    background: var(--off-black);
    padding-top: 1rem; padding-bottom: 0.8rem;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    position: sticky; top: 72px; z-index: 2;
  }
  .survey-progress-track {
    height: 2px; background: rgba(255,255,255,0.08); position: relative;
  }
  .survey-progress-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--white); transition: width 0.4s ease;
  }
  .survey-progress-labels {
    display: flex; justify-content: space-between;
    margin-top: 0.5rem;
  }
  .survey-step-label {
    font-size: 0.55rem; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--mid); transition: color 0.3s; cursor: default;
  }
  .survey-step-label.active { color: var(--white); }
  .survey-step-label.done { color: var(--silver); }

  /* Steps */
  .survey-body { padding: 2rem 2.5rem; }
  .survey-step { display: none; }
  .survey-step.active { display: block; }

  .survey-q {
    font-family: var(--serif); font-size: 1.2rem; font-weight: 400;
    color: var(--white); margin-bottom: 0.4rem; line-height: 1.3;
  }
  .survey-q em { font-style: italic; }
  .survey-hint {
    font-size: 0.72rem; color: var(--mid); margin-bottom: 1.5rem;
    line-height: 1.5;
  }

  /* Option cards — select one or many */
  .survey-options {
    display: grid; gap: 2px; margin-bottom: 1.5rem;
  }
  .survey-options.cols-2 { grid-template-columns: 1fr 1fr; }
  .survey-options.cols-3 { grid-template-columns: 1fr 1fr 1fr; }

  .survey-option {
    background: var(--dark);
    border: 1px solid rgba(255,255,255,0.06);
    padding: 1rem 1.2rem; cursor: none;
    transition: all 0.2s; position: relative;
    display: flex; flex-direction: column; gap: 0.3rem;
  }
  .survey-option:hover { border-color: rgba(255,255,255,0.2); background: var(--charcoal); }
  .survey-option.selected {
    border-color: var(--white); background: var(--charcoal);
  }
  .survey-option.selected::after {
    content: '✓';
    position: absolute; top: 0.6rem; right: 0.8rem;
    font-size: 0.7rem; color: var(--white);
  }
  .survey-option-icon {
    font-size: 1.3rem; margin-bottom: 0.2rem; line-height: 1;
  }
  .survey-option-label {
    font-family: var(--serif); font-size: 0.95rem; font-weight: 400;
    color: var(--white); line-height: 1.2;
  }
  .survey-option-desc {
    font-size: 0.68rem; color: var(--light-mid); line-height: 1.4;
  }

  /* Slider */
  .survey-slider-wrap { margin-bottom: 1.5rem; }
  .survey-slider-labels {
    display: flex; justify-content: space-between;
    font-size: 0.62rem; color: var(--mid); margin-bottom: 0.6rem;
    letter-spacing: 0.08em;
  }
  .survey-slider {
    width: 100%; accent-color: var(--white);
  }
  .survey-slider-val {
    text-align: center; font-family: var(--serif);
    font-size: 1.4rem; font-style: italic; color: var(--white);
    margin-top: 0.5rem;
  }

  /* Text input */
  .survey-textarea {
    width: 100%; background: var(--dark);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--off-white); padding: 0.9rem 1rem;
    font-family: var(--sans); font-size: 0.85rem; font-weight: 300;
    outline: none; resize: none; height: 90px; line-height: 1.6;
    transition: border-color 0.25s; margin-bottom: 1.5rem;
  }
  .survey-textarea:focus { border-color: var(--silver); }
  .survey-textarea::placeholder { color: var(--mid); }

  /* Summary card */
  .survey-summary {
    background: var(--dark); padding: 1.5rem;
    margin-bottom: 1.5rem;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .survey-summary-row {
    display: flex; align-items: baseline; gap: 0.8rem;
    padding: 0.5rem 0; border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .survey-summary-row:last-child { border-bottom: none; }
  .survey-summary-label {
    font-size: 0.58rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--mid); min-width: 110px; flex-shrink: 0;
  }
  .survey-summary-val {
    font-size: 0.82rem; color: var(--silver); line-height: 1.4;
  }

  /* Nav buttons */
  .survey-nav {
    display: flex; gap: 1rem; align-items: center;
    justify-content: space-between; padding-top: 1rem;
    border-top: 1px solid rgba(255,255,255,0.05);
  }
  .survey-back {
    background: none; border: 1px solid rgba(255,255,255,0.1);
    color: var(--mid); padding: 0.75rem 1.5rem;
    font-family: var(--sans); font-size: 0.62rem;
    font-weight: 400; letter-spacing: 0.18em; text-transform: uppercase;
    cursor: none; transition: all 0.25s;
  }
  .survey-back:hover { border-color: var(--silver); color: var(--silver); }
  .survey-next {
    background: var(--white); color: var(--black);
    border: none; padding: 0.85rem 2.5rem;
    font-family: var(--sans); font-size: 0.65rem;
    font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase;
    cursor: none; transition: all 0.25s; margin-left: auto;
  }
  .survey-next:hover { background: var(--silver); }
  .survey-next:disabled { opacity: 0.35; cursor: not-allowed; }
  .survey-skip {
    background: none; border: none; color: var(--mid);
    font-size: 0.62rem; letter-spacing: 0.15em; text-transform: uppercase;
    cursor: none; transition: color 0.2s; padding: 0.5rem;
  }
  .survey-skip:hover { color: var(--silver); }

  /* Image card remove button */
  .img-remove-btn {
    position: absolute; top: 0.7rem; right: 0.7rem; z-index: 6;
    width: 22px; height: 22px; border-radius: 50%;
    background: rgba(10,10,10,0.8); border: 1px solid rgba(255,255,255,0.2);
    color: var(--silver); cursor: none;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .img-remove-btn:hover { background: rgba(255,80,80,0.25); border-color: rgba(255,80,80,0.4); color: #ff6b6b; }
  .img-remove-btn svg { width: 8px; height: 8px; }
  .plan-edit-btn {
    position: absolute; top: 1rem; right: 1rem; z-index: 6;
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(20,20,20,0.9);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--silver); cursor: none;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.25s, border-color 0.2s, background 0.2s;
  }
  .plan-card:hover .plan-edit-btn { opacity: 1; }
  .plan-edit-btn.active {
    opacity: 1; background: rgba(255,255,255,0.1);
    border-color: var(--white); color: var(--white);
  }
  .plan-edit-btn svg { width: 11px; height: 11px; stroke: currentColor; fill: none; }

  /* Editable fields */
  .plan-field-input {
    background: transparent;
    border: none; border-bottom: 1px solid rgba(255,255,255,0.2);
    color: var(--white); outline: none; width: 100%;
    font-family: var(--serif); font-size: 2rem; font-weight: 300;
    padding: 0.1rem 0;
    display: none; transition: border-color 0.2s;
    margin-bottom: 0;
  }
  .plan-field-input:focus { border-bottom-color: var(--white); }

  .plan-tagline-input {
    background: transparent;
    border: none; border-bottom: 1px solid rgba(255,255,255,0.12);
    color: var(--light-mid); outline: none; width: 100%;
    font-family: var(--sans); font-size: 0.72rem; font-weight: 300;
    padding: 0.1rem 0; line-height: 1.5;
    display: none; transition: border-color 0.2s;
  }
  .plan-tagline-input:focus { border-bottom-color: var(--silver); }

  .plan-price-inline-wrap {
    display: none; align-items: center; gap: 0.4rem;
    margin-bottom: 0.3rem;
  }
  .plan-price-inline-wrap .currency-tag {
    font-size: 0.75rem; color: var(--mid); font-family: var(--sans);
  }
  .plan-price-inline-input {
    background: transparent;
    border: none; border-bottom: 1px solid rgba(255,255,255,0.2);
    color: var(--white); outline: none;
    font-family: var(--serif); font-size: 2.6rem; font-weight: 300;
    width: 120px; padding: 0;
    transition: border-color 0.2s;
  }
  .plan-price-inline-input:focus { border-bottom-color: var(--white); }

  /* When plan card is in edit mode */
  .plan-card.plan-editing .plan-name { display: none !important; }
  .plan-card.plan-editing .plan-field-input { display: block; }
  .plan-card.plan-editing .plan-tagline { display: none; }
  .plan-card.plan-editing .plan-tagline-input { display: block; }
  .plan-card.plan-editing .plan-price { display: none; }
  .plan-card.plan-editing .plan-price-inline-wrap { display: flex; }

  /* Feature list editor */
  .plan-features-editor {
    display: none; list-style: none; margin-bottom: 1.5rem;
  }
  .plan-card.plan-editing .plan-features { display: none; }
  .plan-card.plan-editing .plan-features-editor { display: block; }

  .feature-edit-row {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.3rem 0; border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .feature-edit-input {
    flex: 1; background: transparent;
    border: none; outline: none;
    font-family: var(--sans); font-size: 0.78rem; font-weight: 300;
    color: var(--silver); padding: 0.2rem 0;
    transition: color 0.2s;
  }
  .feature-edit-input:focus { color: var(--white); }
  .feature-edit-input.dim-feature { color: var(--mid); }

  .feature-del-btn {
    width: 18px; height: 18px; flex-shrink: 0;
    background: none; border: 1px solid rgba(255,255,255,0.1);
    color: var(--mid); cursor: none; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; font-size: 10px; line-height: 1;
  }
  .feature-del-btn:hover { border-color: rgba(255,80,80,0.4); color: #ff6b6b; }

  .feature-dim-toggle {
    width: 18px; height: 18px; flex-shrink: 0;
    background: none; border: 1px solid rgba(255,255,255,0.1);
    color: var(--mid); cursor: none; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; font-size: 9px;
  }
  .feature-dim-toggle.is-dim { border-color: rgba(255,255,255,0.2); color: var(--silver); }
  .feature-dim-toggle:hover { border-color: var(--silver); color: var(--white); }

  .add-feature-row {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.5rem 0; margin-top: 0.3rem;
  }
  .add-feature-input {
    flex: 1; background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1); outline: none;
    font-family: var(--sans); font-size: 0.75rem;
    color: var(--silver); padding: 0.35rem 0.6rem;
    transition: border-color 0.2s;
  }
  .add-feature-input::placeholder { color: var(--mid); }
  .add-feature-input:focus { border-color: var(--silver); }
  .add-feature-btn {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    color: var(--silver); cursor: none; padding: 0.35rem 0.8rem;
    font-size: 0.6rem; letter-spacing: 0.1em; transition: all 0.2s;
  }
  .add-feature-btn:hover { background: rgba(255,255,255,0.15); color: var(--white); }

  /* Plan edit hint and saved flash */
  .plan-edit-hint {
    display: none; font-size: 0.55rem; color: var(--mid);
    letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 1rem;
  }
  .plan-card.plan-editing .plan-edit-hint { display: block; }

  .plan-saved-flash {
    position: absolute; bottom: 1rem; left: 50%;
    transform: translateX(-50%);
    background: var(--white); color: var(--black);
    font-size: 0.55rem; letter-spacing: 0.2em; text-transform: uppercase;
    padding: 0.3rem 1rem; white-space: nowrap;
    opacity: 0; pointer-events: none; z-index: 7;
    transition: opacity 0.3s;
  }
  .plan-saved-flash.show { opacity: 1; }
    nav { padding: 1.5rem 2rem; }
    nav.scrolled { padding: 1rem 2rem; }
    .nav-links { display: none; }
    section { padding: 5rem 2rem; }
    .about-grid, .custom-grid, .pricing-intro { grid-template-columns: 1fr; gap: 3rem; }
    .tab-content.active { grid-template-columns: 1fr; }
    .pricing-grid, .testimonials-grid { grid-template-columns: 1fr; }
    .footer-grid { grid-template-columns: 1fr 1fr; }
    .hero { padding: 6rem 2rem; }
    .ambient-bar { padding: 1.2rem 2rem; gap: 1.5rem; }
    .disclaimer-banner { padding: 0.85rem 2.5rem; }
    .disclaimer-dismiss { right: 1rem; }
  }

  /* Disclaimer Banner */
  .disclaimer-banner {
    background: rgba(255,255,255,0.03);
    border-top: 1px solid rgba(255,255,255,0.06);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    padding: 0.9rem 4rem;
    display: flex; align-items: center; justify-content: center;
    gap: 1rem; position: relative;
  }
  .disclaimer-icon {
    width: 18px; height: 18px; flex-shrink: 0;
    border: 1px solid var(--silver); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; color: var(--silver); font-style: italic;
    font-family: var(--serif); line-height: 1;
  }
  .disclaimer-text {
    font-size: 0.7rem; color: var(--light-mid);
    letter-spacing: 0.03em; line-height: 1.5; text-align: center;
  }
  .disclaimer-text strong { color: var(--silver); font-weight: 400; }
  .disclaimer-dismiss {
    position: absolute; right: 2rem; top: 50%;
    transform: translateY(-50%);
    background: none; border: none; cursor: none;
    color: var(--mid); font-size: 1.1rem; line-height: 1;
    transition: color 0.2s; padding: 0.2rem;
  }
  .disclaimer-dismiss:hover { color: var(--silver); }
  .disclaimer-banner.hidden { display: none; }
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<!-- Nav -->
<nav id="nav">
  <a href="#" class="logo"><span class="son">Son</span><span class="logo-mark"></span><span class="drift">drift</span></a>
  <ul class="nav-links">
    <li><a href="#shop">Shop</a></li>
    <li><a href="#pricing">Plans</a></li>
    <li><a href="#custom">Custom</a></li>
    <li><a href="#about">About</a></li>
  </ul>
  <a href="#pricing" class="nav-cta">Begin</a>
</nav>

<!-- Hero -->
<section class="hero" id="hero">
  <!-- Layer 0: solid gradient fallback -->
  <div class="hero-bg" id="heroBg"></div>
  <!-- Layer 1: uploaded background image -->
  <div class="hero-bg-img" id="heroBgImg"></div>
  <!-- Layer 2: dark overlay (keeps text legible over any image) -->
  <div class="hero-overlay" id="heroOverlay"></div>
  <!-- Layer 3: subtle grid lines -->
  <div class="hero-lines" id="heroLines"></div>

  <!-- Layer 4: text content (always on top) -->
  <div class="hero-content">
    <div class="hero-eyebrow">Sound · Sensation · Story</div>
    <h1 class="hero-title">Where sound<br>meets <em>silence</em></h1>
    <p class="hero-subtitle">Bespoke ASMR experiences curated to soothe your senses</p>
    <div class="hero-actions">
      <button class="btn-primary" onclick="openModal('shopModal')">Explore Collection</button>
      <button class="btn-ghost" onclick="openModal('subsModal')">Custom Subscription</button>
    </div>
  </div>

  <!-- Background image upload panel -->
  <div class="bg-upload-panel">
    <div class="overlay-controls" id="overlayControls">
      <label>Overlay Darkness</label>
      <input type="range" min="0" max="90" value="50" id="overlaySlider" step="1">
      <div class="overlay-val" id="overlayVal">50%</div>
      <div class="overlay-divider"></div>
      <label style="margin-bottom:0.5rem">Image Position</label>
      <select id="posSelect" style="width:100%;background:var(--dark);border:1px solid rgba(255,255,255,0.1);color:var(--silver);padding:0.4rem 0.6rem;font-family:var(--sans);font-size:0.75rem;outline:none;cursor:none;margin-bottom:0.8rem">
        <option value="center">Center</option>
        <option value="top">Top</option>
        <option value="bottom">Bottom</option>
        <option value="left">Left</option>
        <option value="right">Right</option>
        <option value="top left">Top Left</option>
        <option value="top right">Top Right</option>
      </select>
      <div class="overlay-divider"></div>
      <button class="btn-remove-bg" id="removeBgBtn">Remove Image</button>
    </div>
    <div style="display:flex;gap:0.5rem;align-items:center">
      <span class="bg-hint" id="bgHint">Click to set hero background</span>
      <button class="bg-upload-btn" id="bgUploadBtn" onclick="document.getElementById('bgFileInput').click()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="1" y="4" width="14" height="10" rx="1"/>
          <path d="M5 4V3a3 3 0 016 0v1"/>
          <path d="M8 8v4M6 10l2-2 2 2"/>
        </svg>
        Set Background
      </button>
    </div>
  </div>
  <input type="file" id="bgFileInput" accept="image/*" style="display:none">

  <div class="hero-scroll">
    <div class="scroll-line"></div>
    <span>Scroll</span>
  </div>
</section>

<!-- Ambient Bar -->
<div class="ambient-bar">
  <span class="ambient-item">Soundscapes</span>
  <div class="ambient-dot"></div>
  <span class="ambient-item">Voice Recordings</span>
  <div class="ambient-dot"></div>
  <span class="ambient-item">Sensory Images</span>
  <div class="ambient-dot"></div>
  <span class="ambient-item">Ambient Video</span>
  <div class="ambient-dot"></div>
  <span class="ambient-item">Custom Creations</span>
  <div class="ambient-dot"></div>
  <span class="ambient-item">Personal Delivery</span>
  <div class="ambient-dot"></div>
  <span class="ambient-item">Instant Downloads</span>
</div>

<!-- Disclaimer Banner -->
<div class="disclaimer-banner" id="disclaimerBanner">
  <div class="disclaimer-icon">i</div>
  <p class="disclaimer-text">
    <strong>Therapeutic Content Only.</strong>
    Sondrift provides ASMR experiences intended solely for relaxation, mindfulness, and sensory wellness.
    We do not produce or distribute inappropriate, explicit, or adult content of any kind.
    All content is suitable for general audiences aged 13 and above.
  </p>
  <button class="disclaimer-dismiss" onclick="document.getElementById('disclaimerBanner').classList.add('hidden')" title="Dismiss">×</button>
</div>

<!-- About -->
<section class="about" id="about">
  <div class="section-inner">
    <div class="about-grid">
      <div class="about-visual fade-in">

<script>
  const cursor = document.getElementById('cursor');
  const ring = document.getElementById('cursorRing');
  let mx = 0, my = 0, rx = 0, ry = 0;

  document.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    cursor.style.left = mx + 'px';
    cursor.style.top = my + 'px';
  });

  function animRing() {
    rx += (mx - rx) * 0.12;
    ry += (my - ry) * 0.12;
    ring.style.left = rx + 'px';
    ring.style.top = ry + 'px';
    requestAnimationFrame(animRing);
  }
  animRing();

  document.querySelectorAll('a, button, select, input').forEach(el => {
    el.addEventListener('mouseenter', () => {
      cursor.style.width = '16px';
      cursor.style.height = '16px';
      cursor.style.background = '#fff';
      ring.style.width = '50px';
      ring.style.height = '50px';
    });
    el.addEventListener('mouseleave', () => {
      cursor.style.width = '8px';
      cursor.style.height = '8px';
      cursor.style.background = 'var(--white)';
      ring.style.width = '36px';
      ring.style.height = '36px';
    });
  });

  const nav = document.getElementById('nav');
  window.addEventListener('scroll', () => {
    nav.classList.toggle('scrolled', window.scrollY > 60);
  });

  function switchTab(e, id) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    document.getElementById(id).classList.add('active');
  }

  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) e.target.classList.add('visible');
    });
  }, { threshold: 0.1 });

  document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

  // ============================================
  // SUBSCRIPTION PLAN EDITOR
  // ============================================
  const planIds = ['w', 's', 'sa'];

  // Store features in memory per plan
  const planFeatures = {
    w:  [
      { text: '2 custom soundbites per month', dim: false },
      { text: 'Personalised to your name & mood', dim: false },
      { text: 'Standard 3–5 min duration', dim: false },
      { text: 'Delivered within 5 business days', dim: false },
      { text: 'MP3 + WAV formats included', dim: false },
      { text: 'Video content', dim: true },
      { text: 'Image delivery', dim: true },
      { text: 'Priority creation', dim: true }
    ],
    s:  [
      { text: '2 custom soundbites per month', dim: false },
      { text: '1 bespoke sensory image', dim: false },
      { text: '1 custom ambient video (5 min)', dim: false },
      { text: 'Personalised to your preferences', dim: false },
      { text: 'Delivered within 4 business days', dim: false },
      { text: 'All formats included', dim: false },
      { text: 'Monthly mood questionnaire', dim: false },
      { text: 'Priority creation', dim: true }
    ],
    sa: [
      { text: 'Unlimited custom requests', dim: false },
      { text: 'Soundbites, images & videos', dim: false },
      { text: 'Priority 48-hour creation', dim: false },
      { text: 'Dedicated creation profile', dim: false },
      { text: 'Extended durations (up to 20 min)', dim: false },
      { text: 'Exclusive content not sold in shop', dim: false },
      { text: 'Gift subscription option', dim: false }
    ]
  };

  function buildFeatureEditor(pid) {
    const wrap = document.getElementById('pfedit-' + pid);
    const features = planFeatures[pid];
    wrap.innerHTML = '';

    features.forEach((feat, idx) => {
      const row = document.createElement('div');
      row.className = 'feature-edit-row';

      const inp = document.createElement('input');
      inp.type = 'text';
      inp.className = 'feature-edit-input' + (feat.dim ? ' dim-feature' : '');
      inp.value = feat.text;
      inp.maxLength = 60;
      inp.addEventListener('input', () => { features[idx].text = inp.value; });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });

      // Dim toggle (eye icon — shows whether feature is "greyed out" = not included)
      const dimBtn = document.createElement('button');
      dimBtn.className = 'feature-dim-toggle' + (feat.dim ? '' : ' is-dim');
      dimBtn.title = feat.dim ? 'Mark as included' : 'Mark as not included';
      dimBtn.innerHTML = feat.dim ? '○' : '●';
      dimBtn.addEventListener('click', () => {
        features[idx].dim = !features[idx].dim;
        inp.classList.toggle('dim-feature', features[idx].dim);
        dimBtn.className = 'feature-dim-toggle' + (features[idx].dim ? '' : ' is-dim');
        dimBtn.innerHTML = features[idx].dim ? '○' : '●';
        dimBtn.title = features[idx].dim ? 'Mark as included' : 'Mark as not included';
      });

      const delBtn = document.createElement('button');
      delBtn.className = 'feature-del-btn';
      delBtn.innerHTML = '×';
      delBtn.title = 'Remove feature';
      delBtn.addEventListener('click', () => {
        features.splice(idx, 1);
        buildFeatureEditor(pid);
      });

      row.appendChild(inp);
      row.appendChild(dimBtn);
      row.appendChild(delBtn);
      wrap.appendChild(row);
    });

    // Add new feature row
    const addRow = document.createElement('div');
    addRow.className = 'add-feature-row';
    const addInp = document.createElement('input');
    addInp.type = 'text';
    addInp.className = 'add-feature-input';
    addInp.placeholder = 'Add a feature…';
    addInp.maxLength = 60;
    const addBtn = document.createElement('button');
    addBtn.className = 'add-feature-btn';
    addBtn.textContent = '+ Add';
    const doAdd = () => {
      const val = addInp.value.trim();
      if (!val) return;
      features.push({ text: val, dim: false });
      addInp.value = '';
      buildFeatureEditor(pid);
    };
    addBtn.addEventListener('click', doAdd);
    addInp.addEventListener('keydown', e => { if (e.key === 'Enter') doAdd(); });
    addRow.appendChild(addInp);
    addRow.appendChild(addBtn);
    wrap.appendChild(addRow);
  }

  function applyPlanFeatures(pid) {
    const ul = document.getElementById('pfeatures-' + pid);
    ul.innerHTML = '';
    planFeatures[pid].forEach(feat => {
      const li = document.createElement('li');
      if (feat.dim) li.className = 'dim';
      li.textContent = feat.text;
      ul.appendChild(li);
    });
  }

  function applyPlanPrice(pid) {
    const inp = document.getElementById('pprice-inp-' + pid);
    const disp = document.getElementById('pprice-' + pid);
    const val = parseFloat(inp.value) || 0;
    const whole = Math.floor(val);
    const cents = '.' + String(Math.round((val - whole) * 100)).padStart(2, '0');
    disp.innerHTML = `<sup>SGD </sup>${whole}<sup>${cents}</sup>`;
  }

  function togglePlanEdit(pid) {
    const card = document.getElementById('pc-' + pid);
    const btn  = document.getElementById('peb-' + pid);
    const isEditing = card.classList.contains('plan-editing');
    if (isEditing) {
      savePlanEdit(pid);
    } else {
      // Close any other open plan editors
      planIds.forEach(id => {
        if (id !== pid && document.getElementById('pc-' + id).classList.contains('plan-editing')) {
          savePlanEdit(id);
        }
      });
      openPlanEdit(pid);
    }
  }

  function openPlanEdit(pid) {
    const card = document.getElementById('pc-' + pid);
    const btn  = document.getElementById('peb-' + pid);
    const nameInp    = document.getElementById('pname-inp-' + pid);
    const tagInp     = document.getElementById('ptagline-inp-' + pid);
    const nameDisp   = document.getElementById('pname-' + pid);
    const tagDisp    = document.getElementById('ptagline-' + pid);

    // Sync values
    nameInp.value = nameDisp.textContent.trim();
    tagInp.value  = tagDisp.textContent.trim();

    card.classList.add('plan-editing');
    btn.classList.add('active');
    btn.title = 'Save changes';
    btn.innerHTML = '<svg viewBox="0 0 12 12" fill="none"><path d="M2 6L5 9L10 3" stroke="currentColor" stroke-width="1.5"/></svg>';

    buildFeatureEditor(pid);
    nameInp.focus();
    nameInp.select();

    nameInp.onkeydown = e => {
      if (e.key === 'Enter') { e.preventDefault(); tagInp.focus(); }
      if (e.key === 'Escape') savePlanEdit(pid);
    };
    tagInp.onkeydown = e => {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('pprice-inp-' + pid).focus(); }
      if (e.key === 'Escape') savePlanEdit(pid);
    };

    // Live price preview
    const priceInp = document.getElementById('pprice-inp-' + pid);
    priceInp.oninput = () => applyPlanPrice(pid);
    priceInp.onkeydown = e => { if (e.key === 'Escape') savePlanEdit(pid); };
  }

  function savePlanEdit(pid) {
    const card    = document.getElementById('pc-' + pid);
    const btn     = document.getElementById('peb-' + pid);
    const nameInp = document.getElementById('pname-inp-' + pid);
    const tagInp  = document.getElementById('ptagline-inp-' + pid);
    const nameDisp= document.getElementById('pname-' + pid);
    const tagDisp = document.getElementById('ptagline-' + pid);
    const flash   = document.getElementById('psaved-' + pid);
    const planBtn = document.getElementById('pbtn-' + pid);

    // Apply name
    const newName = nameInp.value.trim();
    if (newName) {
      nameDisp.textContent = newName;
      // Update CTA button text
      if (planBtn) planBtn.textContent = 'Choose ' + newName;
    }
    // Apply tagline
    const newTag = tagInp.value.trim();
    if (newTag) tagDisp.textContent = newTag;

    // Apply price
    applyPlanPrice(pid);

    // Apply features
    applyPlanFeatures(pid);

    // Exit edit mode
    card.classList.remove('plan-editing');
    btn.classList.remove('active');
    btn.title = 'Edit plan';
    btn.innerHTML = '<svg viewBox="0 0 12 12"><path d="M7.5 1.5L10.5 4.5L4 11H1V8L7.5 1.5Z" stroke-width="1.2"/><path d="M6 3L9 6" stroke-width="1.2"/></svg>';

    // Flash saved
    flash.classList.add('show');
    setTimeout(() => flash.classList.remove('show'), 1800);
  }

  // Click outside a plan card in edit mode → save
  document.addEventListener('click', e => {
    planIds.forEach(pid => {
      const card = document.getElementById('pc-' + pid);
      if (card && card.classList.contains('plan-editing') && !card.contains(e.target)) {
        savePlanEdit(pid);
      }
    });
  });

  // ============================================
  // ============================================
  // IMAGE CARD UPLOAD
  // ============================================
  function loadImage(id, input) {
    const file = input.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    const preview = document.getElementById('ipreview' + id);
    const icon    = document.getElementById('iicon' + id);
    const zone    = document.getElementById('imuz' + id);
    const rmBtn   = document.getElementById('imrm' + id);
    preview.style.backgroundImage = `url('${url}')`;
    preview.style.display = 'block';
    icon.style.display = 'none';
    zone.classList.add('has-media');
    rmBtn.style.display = 'flex';
  }

  function removeImage(id) {
    const preview = document.getElementById('ipreview' + id);
    const icon    = document.getElementById('iicon' + id);
    const zone    = document.getElementById('imuz' + id);
    const rmBtn   = document.getElementById('imrm' + id);
    const input   = document.getElementById('imf' + id);
    preview.style.backgroundImage = '';
    preview.style.display = 'none';
    icon.style.display = '';
    zone.classList.remove('has-media');
    rmBtn.style.display = 'none';
    input.value = '';
  }

  // ============================================
  // INLINE CARD EDITOR (Soundbites + Images)
  // ============================================
  const soundCards = ['sc1','sc2','sc3','ic1','ic2','ic3'];
  const cardNums   = ['1','2','3'];

  function toggleCardEdit(cardId) {
    const card = document.getElementById(cardId);
    const isEditing = card.classList.contains('card-editing');
    if (isEditing) {
      saveCardEdit(cardId);
    } else {
      // Close any other open cards first
      soundCards.forEach(id => {
        if (id !== cardId && document.getElementById(id).classList.contains('card-editing')) {
          saveCardEdit(id);
        }
      });
      openCardEdit(cardId);
    }
  }

  function getCardIds(cardId) {
    const isImage = cardId.startsWith('ic');
    const suffix = isImage ? cardId.replace('ic', 'ic') : cardId.replace('sc', '');
    const idKey  = isImage ? cardId : suffix;
    return {
      nameInput: document.getElementById(isImage ? 'sni-' + cardId  : 'sni' + suffix),
      descInput: document.getElementById(isImage ? 'sdi-' + cardId  : 'sdi' + suffix),
      nameDisp:  document.getElementById(isImage ? 'sn-'  + cardId  : 'sn'  + suffix),
      descDisp:  document.getElementById(isImage ? 'sd-'  + cardId  : 'sd'  + suffix),
      editBtn:   document.getElementById(isImage ? 'ecib' + cardId.replace('ic','') : 'ecb' + suffix),
      flash:     document.getElementById(isImage ? 'sf-'  + cardId  : 'sf'  + suffix),
    };
  }

  function openCardEdit(cardId) {
    const card = document.getElementById(cardId);
    const ids  = getCardIds(cardId);
    const { nameInput, descInput, nameDisp, descDisp, editBtn } = ids;

    nameInput.value = nameDisp.textContent;
    descInput.value = descDisp.textContent;

    card.classList.add('card-editing');
    editBtn.classList.add('active');
    editBtn.title = 'Save changes';
    editBtn.innerHTML = '<svg viewBox="0 0 12 12" fill="none"><path d="M2 6L5 9L10 3" stroke="currentColor" stroke-width="1.5"/></svg>';

    autoResizeTextarea(descInput);
    nameInput.focus();
    nameInput.select();

    nameInput.onkeydown = function(e) {
      if (e.key === 'Enter') { e.preventDefault(); descInput.focus(); }
      if (e.key === 'Escape') saveCardEdit(cardId);
    };
    descInput.onkeydown = function(e) {
      if (e.key === 'Escape') saveCardEdit(cardId);
      if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); saveCardEdit(cardId); }
    };
    descInput.oninput = function() { autoResizeTextarea(this); };
  }

  function saveCardEdit(cardId) {
    const card = document.getElementById(cardId);
    const ids  = getCardIds(cardId);
    const { nameInput, descInput, nameDisp, descDisp, editBtn, flash } = ids;

    const newName = nameInput.value.trim();
    const newDesc = descInput.value.trim();
    if (newName) nameDisp.textContent = newName;
    if (newDesc) descDisp.textContent = newDesc;
    nameInput.value = nameDisp.textContent;
    descInput.value = descDisp.textContent;

    card.classList.remove('card-editing');
    editBtn.classList.remove('active');
    editBtn.title = 'Edit name & description';
    editBtn.innerHTML = '<svg viewBox="0 0 12 12" fill="none"><path d="M7.5 1.5L10.5 4.5L4 11H1V8L7.5 1.5Z" stroke-width="1.2"/><path d="M6 3L9 6" stroke-width="1.2"/></svg>';

    flash.classList.add('show');
    setTimeout(() => flash.classList.remove('show'), 1800);
  }

  function autoResizeTextarea(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  // Click outside any editing card → save it
  document.addEventListener('click', function(e) {
    soundCards.forEach(cardId => {
      const card = document.getElementById(cardId);
      if (card && card.classList.contains('card-editing') && !card.contains(e.target)) {
        saveCardEdit(cardId);
      }
    });
  });

  // ============================================
  function openModal(id) {
    const m = document.getElementById(id);
    m.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeModal(id) {
    const m = document.getElementById(id);
    m.classList.remove('open');
    document.body.style.overflow = '';
    // If editing, turn it off on close
    const prefix = id === 'shopModal' ? 'shop' : 'subs';
    const body = document.getElementById(prefix + 'ModalBody');
    if (body && body.classList.contains('editing-mode')) {
      body.classList.remove('editing-mode');
      document.getElementById(prefix + 'EditBtn').classList.remove('editing');
      document.getElementById(prefix + 'SaveBar').classList.remove('visible');
    }
  }
  // Close on backdrop click
  document.addEventListener('click', function(e) {
    ['shopModal','subsModal'].forEach(id => {
      const m = document.getElementById(id);
      if (e.target === m) closeModal(id);
    });
  });
