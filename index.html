  // Shared audio instances
  const audioInstances = {};

  function fmtTime(s) {
    if (isNaN(s)) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function buildWaveform(containerId, bars = 32) {
    const wrap = document.getElementById(containerId);
    if (!wrap) return;
    wrap.innerHTML = '';
    for (let i = 0; i < bars; i++) {
      const b = document.createElement('div');
      b.className = 'audio-bar';
      const h = 4 + Math.random() * 28;
      b.style.height = h + 'px';
      wrap.appendChild(b);
    }
  }

  function updateWaveform(containerId, progress) {
    const wrap = document.getElementById(containerId);
    if (!wrap) return;
    const bars = wrap.querySelectorAll('.audio-bar');
    const activeCount = Math.floor(progress * bars.length);
    bars.forEach((b, i) => b.classList.toggle('active', i < activeCount));
  }

  function loadAudio(id, input) {
    const file = input.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);

    // Stop any playing audio
    if (audioInstances[id]) {
      audioInstances[id].pause();
      URL.revokeObjectURL(audioInstances[id].src);
    }

    const audio = new Audio(url);
    audioInstances[id] = audio;

    const player   = document.getElementById('ap' + id);
    const filename = document.getElementById('af' + id);
    const playBtn  = document.getElementById('apb' + id);
    const progWrap = document.getElementById('apr' + id);
    const progFill = document.getElementById('apf' + id);
    const progThumb= document.getElementById('apt' + id);
    const timeEl   = document.getElementById('at' + id);
    const removeBtn= document.getElementById('arm' + id);
    const zone     = document.getElementById('muz' + id);

    // Show name
    const name = file.name.length > 26 ? file.name.substring(0,24) + '…' : file.name;
    filename.textContent = name;

    // Build waveform
    buildWaveform('aw' + id);

    // Show player
    player.classList.add('active');
    zone.classList.add('has-media');

    // Play/pause toggle
    let playing = false;
    playBtn.onclick = function() {
      if (playing) {
        audio.pause();
      } else {
        // Pause all other audio
        Object.entries(audioInstances).forEach(([k,a]) => {
          if (k !== id) { a.pause(); updatePlayBtn(k, false); }
        });
        audio.play();
      }
    };

    function updatePlayBtn(pid, isPlaying) {
      const btn = document.getElementById('apb' + pid);
      if (!btn) return;
      btn.innerHTML = isPlaying
        ? '<svg viewBox="0 0 12 12"><rect x="2" y="2" width="3" height="8" fill="currentColor"/><rect x="7" y="2" width="3" height="8" fill="currentColor"/></svg>'
        : '<svg viewBox="0 0 12 12"><path d="M3 2L10 6L3 10Z" fill="currentColor"/></svg>';
    }

    audio.addEventListener('play',  () => { playing = true;  updatePlayBtn(id, true); });
    audio.addEventListener('pause', () => { playing = false; updatePlayBtn(id, false); });
    audio.addEventListener('ended', () => { playing = false; updatePlayBtn(id, false); updateWaveform('aw'+id, 0); });

    audio.addEventListener('loadedmetadata', () => {
      timeEl.textContent = '0:00 / ' + fmtTime(audio.duration);
    });

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      progFill.style.width = pct + '%';
      progThumb.style.left = pct + '%';
      timeEl.textContent = fmtTime(audio.currentTime) + ' / ' + fmtTime(audio.duration);
      updateWaveform('aw' + id, audio.currentTime / audio.duration);
    });

    // Seek
    progWrap.addEventListener('click', function(e) {
      if (!audio.duration) return;
      const rect = this.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pct * audio.duration;
    });

    // Remove
    removeBtn.onclick = function() {
      audio.pause();
      player.classList.remove('active');
      zone.classList.remove('has-media');
      progFill.style.width = '0%';
      progThumb.style.left = '0%';
      timeEl.textContent = '0:00 / 0:00';
      updatePlayBtn(id, false);
      input.value = '';
      delete audioInstances[id];
    };
  }

        vid.pause();

        Object.entries(videoInstances).forEach(([k,v]) => {

    function updateVPlayBtnById(pid, isPlaying) {
      const btn = document.getElementById('vpb' + pid);
      if (!btn) return;
      btn.innerHTML = isPlaying
        ? '<svg viewBox="0 0 10 10"><rect x="1" y="1" width="3" height="8" fill="currentColor"/><rect x="6" y="1" width="3" height="8" fill="currentColor"/></svg>'
        : '<svg viewBox="0 0 10 10"><path d="M2 1.5L8.5 5L2 8.5Z" fill="currentColor"/></svg>';
    }

    vid.addEventListener('play',  () => updateVPlayBtn(true));
    vid.addEventListener('pause', () => updateVPlayBtn(false));
    vid.addEventListener('ended', () => { updateVPlayBtn(false); progFill.style.width = '0%'; });

    vid.addEventListener('loadedmetadata', () => {
      timeEl.textContent = '0:00 / ' + fmtTime(vid.duration);
    });

    vid.addEventListener('timeupdate', () => {
      if (!vid.duration) return;
      const pct = (vid.currentTime / vid.duration) * 100;
      progFill.style.width = pct + '%';
      timeEl.textContent = fmtTime(vid.currentTime) + ' / ' + fmtTime(vid.duration);
    });

    progWrap.addEventListener('click', function(e) {
      if (!vid.duration) return;
      const rect = this.getBoundingClientRect();
      vid.currentTime = ((e.clientX - rect.left) / rect.width) * vid.duration;
    });

    volBtn.onclick = function() {
      muted = !muted;
      vid.muted = muted;
      volBtn.style.opacity = muted ? '0.35' : '1';
    };

    rmBtn.onclick = function() {

      vid.src = '';
      player.classList.remove('active');
      zone.classList.remove('has-media');
      progFill.style.width = '0%';
      timeEl.textContent = '0:00 / 0:00';
      updateVPlayBtn(false);
      input.value = '';
      delete videoInstances[id];

  }

  function openSurvey(planName, stripeKey) {
    surveyPlanName = planName;

    document.getElementById('surveyModal').classList.remove('open');

  function showStep(n) {
    document.querySelectorAll('.survey-step').forEach(s => s.classList.remove('active'));
    document.getElementById('step-' + n).classList.add('active');
    const pct = Math.round(((n - 1) / (TOTAL_STEPS - 1)) * 100);
    document.getElementById('surveyProgressFill').style.width = pct + '%';
    for (let i = 1; i <= TOTAL_STEPS; i++) {
      const lbl = document.getElementById('slbl-' + i);
      lbl.classList.remove('active','done');
      if (i === n) lbl.classList.add('active');
      if (i < n)  lbl.classList.add('done');
    }
    if (n === TOTAL_STEPS) buildSummary();
  }

  function surveyNext() {
    // Save current step answers
    saveCurrentAnswers();
    if (surveyCurrentStep < TOTAL_STEPS) {
      surveyCurrentStep++;
      showStep(surveyCurrentStep);
    }
  }

  function surveyBack() {
    if (surveyCurrentStep > 1) {
      surveyCurrentStep--;
      showStep(surveyCurrentStep);
    }
  }

  function toggleOption(el, group, single) {
    if (single) {

  function saveCurrentAnswers() {
    const step = surveyCurrentStep;
    if (step === 1) {
      surveyAnswers.mood = getSelected('#opts-mood');
    } else if (step === 2) {
      surveyAnswers.sound = getSelected('#opts-sound');
    } else if (step === 3) {
      surveyAnswers.env = getSelected('#opts-env')[0] || '';
    } else if (step === 4) {
      surveyAnswers.voice = getSelected('#opts-voice')[0] || '';
    } else if (step === 5) {
      surveyAnswers.duration = document.getElementById('durationVal').textContent;
      surveyAnswers.timing = getSelected('#opts-timing');

      surveyAnswers.personalNote = document.getElementById('surveyPersonalNote').value.trim();
      surveyAnswers.discover = getSelected('#opts-discover');

  async function handleSurveySubmit(e) {
    e.preventDefault();
    const form = document.getElementById('surveySubmitForm');
    const btn  = document.getElementById('surveySubmitBtn');
    const ok   = document.getElementById('surveyFormSuccess');
    const err  = document.getElementById('surveyFormError');

    btn.textContent = 'Saving…';
    btn.disabled = true;

    try {
      const res = await fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      });
      ok.style.display = 'block';
      btn.textContent = 'Saved ✓';
      // After 2s, redirect to Stripe
      setTimeout(() => {
        closeSurvey();
        goToStripe(surveyStripeKey);
        btn.textContent = 'Save Profile & Continue →';
        btn.disabled = false;
      }, 2000);
    } catch {
      err.style.display = 'block';
      btn.textContent = 'Save Profile & Continue →';
      btn.disabled = false;
      // Still allow checkout even if form fails
      setTimeout(() => { closeSurvey(); goToStripe(surveyStripeKey); }, 2500);
    }
  }

  document.getElementById('pbtn-sa') && document.getElementById('pbtn-sa').addEventListener('click', () => goToStripe('plan_sanctuary'));

  // Modal plan CTA buttons
  document.querySelectorAll('.modal-plan-cta').forEach((btn, i) => {
    const keys = ['plan_whisper','plan_serenity','plan_sanctuary'];
    btn.addEventListener('click', () => goToStripe(keys[i] || 'plan_whisper'));
  });

  // ============================================
  // CURRENCY SWITCHER
  // ============================================
  const FX = {
    SGD: { symbol: 'SGD', rate: 1 },
    USD: { symbol: 'USD', rate: 0.74 },
    GBP: { symbol: 'GBP', rate: 0.59 },
    EUR: { symbol: 'EUR', rate: 0.68 },
    AUD: { symbol: 'AUD', rate: 1.14 },
    JPY: { symbol: 'JPY', rate: 82.5 },
    CAD: { symbol: 'CAD', rate: 1.01 },
  };

  // Base SGD prices for all items
  const BASE_PRICES = {
    's1': 6.99, 's2': 24.99, 's3': 18.99,
    'i1': 4.99, 'i2': 18.99, 'i3': 14.99,
    'v1': 12.99, 'v2': 29.99, 'v3': 34.99,
    'plan_w': 19.99, 'plan_s': 39.99, 'plan_sa': 79.99,
  };

  let currentCurrency = 'USD';

  function formatPrice(sgdAmount, currency) {
    const fx = FX[currency];
    const converted = sgdAmount * fx.rate;
    if (currency === 'JPY') return fx.symbol + ' ' + Math.round(converted);
    const floored = Math.floor(converted);
    return fx.symbol + ' ' + floored + '.99';
  }

  function changeCurrency(currency) {
    currentCurrency = currency;
    const fx = FX[currency];

    // Update shop product prices
    document.querySelectorAll('.product-price').forEach(el => {
      const span = el.querySelector('span');
      const key = el.dataset.priceKey;
      if (key && BASE_PRICES[key] !== undefined) {
        const formatted = formatPrice(BASE_PRICES[key], currency);
        const parts = formatted.split(' ');
        el.innerHTML = `<span>${parts[0]} </span>${parts[1]}`;
      }
    });

    // Update plan card prices
    ['w','s','sa'].forEach(id => {
      const disp = document.getElementById('pprice-' + id);
      const key = 'plan_' + id;
      if (disp && BASE_PRICES[key]) {
        const val = BASE_PRICES[key] * fx.rate;
        const whole = currency === 'JPY' ? Math.round(val) : Math.floor(val);
        const cents = currency === 'JPY' ? '' : '.99';
        disp.innerHTML = `<sup>${fx.symbol} </sup>${whole}<sup>${cents}</sup>`;
      }
    });

    // Update shop pricing modal prices
    Object.entries(BASE_PRICES).forEach(([key, sgdVal]) => {
      const dispEl = document.getElementById('p-' + key);
      if (dispEl) dispEl.textContent = formatPrice(sgdVal, currency);
    });
  }

  // Attach price keys to product price elements on page load
  function initPriceKeys() {
    const priceMap = [
      // Shop soundbites
      { cardId: 'sc1', key: 's1' }, { cardId: 'sc2', key: 's1' }, { cardId: 'sc3', key: 's2' },
      // Shop images
      { cardId: 'ic1', key: 'i1' }, { cardId: 'ic2', key: 'i1' }, { cardId: 'ic3', key: 'i2' },
      // Shop videos
      { cardId: 'vc1', key: 'v1' }, { cardId: 'vc2', key: 'v1' }, { cardId: 'vc3', key: 'v2' },
    ];
    priceMap.forEach(({ cardId, key }) => {
      const card = document.getElementById(cardId);
      if (card) {
        card.dataset.stripe = key.startsWith('s') ? 'soundbite_single' :
                              key.startsWith('i') ? 'image_single' : 'video_single';
        const priceEl = card.querySelector('.product-price');
        if (priceEl) priceEl.dataset.priceKey = key;
      }
    });
  }
  initPriceKeys();
  changeCurrency('USD');

  function switchTabByName(id) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    const tab = document.querySelector(`.tab[onclick*="${id}"]`);
    if (tab) tab.classList.add('active');
    const content = document.getElementById(id);
    if (content) content.classList.add('active');
  }

  // ============================================
  // CONTACT FORM (Formspree)
  // ============================================
  async function handleFormSubmit(e) {
    e.preventDefault();
    const form = document.getElementById('customRequestForm');
    const btn  = document.getElementById('formSubmitBtn');
    const ok   = document.getElementById('formSuccess');
    const err  = document.getElementById('formError');

    btn.textContent = 'Sending…';
    btn.disabled = true;
    ok.style.display = 'none';
    err.style.display = 'none';

    try {
      const res = await fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      });
      if (res.ok) {
        ok.style.display = 'block';
        form.reset();
        btn.textContent = 'Sent ✓';
        setTimeout(() => { btn.textContent = 'Send Request'; btn.disabled = false; }, 3000);
      } else {
        throw new Error('failed');
      }
    } catch {
      err.style.display = 'block';
      btn.textContent = 'Send Request';
      btn.disabled = false;
    }
  }
</script>

            <div class="survey-option-label">Morning</div>
            <div class="survey-option-desc">Starting the day gently</div>
          </div>
          <div class="survey-option" data-val="Afternoon break" onclick="toggleOption(this,'timing')">
            <div class="survey-option-label">Afternoon</div>
            <div class="survey-option-desc">Midday reset</div>
          </div>
          <div class="survey-option" data-val="Evening wind-down" onclick="toggleOption(this,'timing')">
            <div class="survey-option-label">Evening</div>
            <div class="survey-option-desc">Transitioning to rest</div>
          </div>
          <div class="survey-option" data-val="Bedtime" onclick="toggleOption(this,'timing')">
            <div class="survey-option-label">Bedtime</div>
            <div class="survey-option-desc">Falling asleep</div>
          </div>
          <div class="survey-option" data-val="During work" onclick="toggleOption(this,'timing')">
            <div class="survey-option-label">Work hours</div>
            <div class="survey-option-desc">Background focus</div>
          </div>
          <div class="survey-option" data-val="Anytime" onclick="toggleOption(this,'timing')">
            <div class="survey-option-label">Anytime</div>
            <div class="survey-option-desc">Whenever I need it</div>
          </div>
        </div>
        <div class="survey-nav">
          <button class="survey-back" onclick="surveyBack()">← Back</button>
          <button class="survey-skip" onclick="surveyNext()">Skip</button>
          <button class="survey-next" onclick="surveyNext()">Continue →</button>
        </div>
      </div>

      <!-- Step 6: Themes & Personal Note -->
      <div class="survey-step" id="step-6">
        <div class="survey-q">Any themes, memories, or words we should know?</div>
        <div class="survey-hint">Optional — but the more you share, the more personal your content will be. Nothing is too abstract.</div>
        <textarea class="survey-textarea" id="surveyPersonalNote" placeholder="A particular memory, a feeling, a colour, a season, a word that captures where you want to go…" maxlength="400"></textarea>
        <div class="survey-q">How do you discover ASMR?</div>
        <div class="survey-hint">Helps us understand you better.</div>
        <div class="survey-options cols-3" id="opts-discover">
          <div class="survey-option" data-val="YouTube" onclick="toggleOption(this,'discover')">
            <div class="survey-option-label">YouTube</div>
          </div>
          <div class="survey-option" data-val="Spotify / podcasts" onclick="toggleOption(this,'discover')">
            <div class="survey-option-label">Spotify</div>
          </div>
          <div class="survey-option" data-val="TikTok / Reels" onclick="toggleOption(this,'discover')">
            <div class="survey-option-label">TikTok / Reels</div>
          </div>
          <div class="survey-option" data-val="Recommendation" onclick="toggleOption(this,'discover')">
            <div class="survey-option-label">Recommendation</div>
          </div>
          <div class="survey-option" data-val="Search / Google" onclick="toggleOption(this,'discover')">
            <div class="survey-option-label">Search / Google</div>
          </div>
          <div class="survey-option" data-val="Other" onclick="toggleOption(this,'discover')">
            <div class="survey-option-label">Other</div>
          </div>
        </div>
        <div class="survey-nav">
          <button class="survey-back" onclick="surveyBack()">← Back</button>
          <button class="survey-skip" onclick="surveyNext()">Skip</button>
          <button class="survey-next" onclick="surveyNext()">Review →</button>
        </div>
      </div>

      <!-- Step 7: Summary & Submit -->
      <div class="survey-step" id="step-7">
        <div class="survey-q">Your <em>sensory profile</em></div>
        <div class="survey-hint">Here's what we've captured. You can go back to edit anything.</div>
        <div class="survey-summary" id="surveySummary"></div>

        <div class="survey-q" style="margin-top:0">One last thing — your details</div>
        <div class="survey-hint">So we can attach your profile to your plan.</div>
        <!-- FORMSPREE: Replace YOUR_SURVEY_FORM_ID with a new Formspree form for surveys -->
        <form id="surveySubmitForm" action="https://formspree.io/f/YOUR_SURVEY_FORM_ID" method="POST" onsubmit="handleSurveySubmit(event)">
          <input type="hidden" name="_subject" id="surveySubject" value="New Sondrift Preference Profile">
          <input type="hidden" name="plan" id="surveyPlanInput" value="">
          <input type="hidden" name="mood_goals" id="surveyMoodInput" value="">
          <input type="hidden" name="sound_preferences" id="surveySoundInput" value="">
          <input type="hidden" name="environment" id="surveyEnvInput" value="">
          <input type="hidden" name="voice_preference" id="surveyVoiceInput" value="">
          <input type="hidden" name="duration" id="surveyDurationInput" value="">
          <input type="hidden" name="listening_times" id="surveyTimingInput" value="">
          <input type="hidden" name="personal_note" id="surveyNoteInput" value="">
          <input type="hidden" name="discovery_source" id="surveyDiscoverInput" value="">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
            <div class="form-group" style="margin-bottom:0">
              <label class="form-label">Your Name</label>
              <input type="text" name="name" class="form-input" placeholder="Your name" required>
            </div>
            <div class="form-group" style="margin-bottom:0">
              <label class="form-label">Your Email</label>
              <input type="email" name="email" class="form-input" placeholder="Your email" required>
            </div>
          </div>
          <div id="surveyFormSuccess" style="display:none;padding:0.8rem 1rem;background:rgba(255,255,255,0.04);border-left:2px solid var(--white);margin-bottom:1rem;font-size:0.78rem;color:var(--silver)">
            ✓ Profile saved! We'll use this to craft your content. Redirecting to checkout…
          </div>
          <div id="surveyFormError" style="display:none;padding:0.8rem 1rem;background:rgba(255,80,80,0.06);border-left:2px solid #ff6b6b;margin-bottom:1rem;font-size:0.78rem;color:#ff9999">
            Something went wrong. Please email contact@sondrift.com with your preferences.
          </div>
          <div class="survey-nav" style="border-top:none;padding-top:0">
            <button type="button" class="survey-back" onclick="surveyBack()">← Back</button>
            <button type="submit" class="survey-next" id="surveySubmitBtn">Save Profile & Continue →</button>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>

</body>
</html>
